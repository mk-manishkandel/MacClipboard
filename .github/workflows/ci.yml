name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build universal app
        run: |
          # Keep the full log so errors are shown even when they are far from the end.
          if ! xcodebuild -project Maccy.xcodeproj -scheme Maccy -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" ENABLE_HARDENED_RUNTIME=NO \
            build > build.log 2>&1; then
            grep -E 'error:|Stack dump|PLEASE submit|Segmentation|Abort trap|signal' build.log | sort -u | head -n 50
            tail -n 30 build.log
            exit 1
          fi
          tail -n 3 build.log
          lipo -archs build/Build/Products/Release/MacClipboard.app/Contents/MacOS/MacClipboard

      - name: Run unit tests
        run: |
          if ! xcodebuild test -project Maccy.xcodeproj -scheme Maccy -destination 'platform=macOS' \
            -only-testing:MaccyTests -derivedDataPath build/test \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" ENABLE_HARDENED_RUNTIME=NO \
            > test.log 2>&1; then
            grep -E '✘|error:|Fatal error|recorded an issue' test.log | sort -u | head -n 50
            tail -n 30 test.log
            exit 1
          fi
          grep -E 'Test run with|TEST SUCCEEDED' test.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
